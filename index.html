<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <div>
      <input id="email" type="email" placeholder="email" />
      <input id="password" type="password" placeholder="password" />
      <button id="signup">Sign up</button>
      <button id="signin">Sign in</button>
      <button id="signout">Sign out</button>
    </div>

    <div id="create-playlist-card" style="display: none">
      <h3>Create Playlist</h3>
      <input id="playlist-name" type="text" placeholder="Playlist name" />
      <button id="create-playlist">Create</button>
    </div>

    <div id="playlists-card" style="display: none">
      <h3>Your Playlists</h3>
      <div id="playlists"></div>
    </div>

    <div id="songs-card" style="display: none">
      <h3 id="songs-title">Songs</h3>
      <input id="file" type="file" accept="audio/*" />
      <button id="upload">Upload</button>
      <ul id="songs"></ul>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="./script.js" defer></script>
  </body>
</html>
